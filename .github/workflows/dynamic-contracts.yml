name: Dynamic Contract Tests

on:
  workflow_call:
    inputs:
      qinit_repository:
        type: string
        required: true
      qinit_pin:
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Build and smoke the node on the same runner so every supported platform gates.
  build-smoke:
    name: build-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            key: linux-x64
            release_file: Qubic-linux-x64
          - runner: ubuntu-24.04-arm
            key: linux-arm64
            release_file: Qubic-linux-arm64
          - runner: macos-15
            key: darwin-arm64
            arch: arm64
            release_file: Qubic-darwin-arm64
          - runner: macos-15-intel
            key: darwin-x64
            arch: x86_64
            release_file: Qubic-darwin-x64
          - runner: windows-2022
            key: windows-x64
            release_file: Qubic-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout core-lite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: core
          persist-credentials: false

      - name: Checkout qinit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ inputs.qinit_repository }}
          ref: ${{ inputs.qinit_pin }}
          path: qinit
          persist-credentials: false

      - name: Read qinit toolchains
        id: toolchains
        shell: bash
        run: |
          # shellcheck disable=SC2016  # ${...} below are JavaScript template literals
          node -e '
            const config = require("./qinit/config/toolchains.json");
            const bunVersion = config?.bun?.version;
            if (
              typeof bunVersion !== "string" ||
              !/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(bunVersion)
            ) {
              throw new Error("invalid qinit Bun version");
            }
            console.log(`bun_version=${bunVersion}`);
          ' >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: ${{ steps.toolchains.outputs.bun_version }}

      - name: Build standalone Linux node
        if: startsWith(matrix.key, 'linux-')
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/core:/src" \
            --workdir /src \
            alpine:3.22 \
            sh -euxc '
              apk add --no-cache \
                autoconf automake bash boost-dev build-base clang20 cmake git \
                libffi-dev libtool linux-headers nasm openssl-dev \
                openssl-libs-static util-linux-dev util-linux-static \
                zlib-dev zlib-static
              cmake -S . -B build-node \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DBUILD_BINARY=ON \
                -DBUILD_TESTS=OFF \
                -DENABLE_AVX512=OFF \
                -DUSE_SANITIZER=OFF \
                -DTESTNET=ON \
                -DTESTNET_LITE_RAM=ON \
                -DTESTNET_PREFILL_QUS=ON \
                -DLITE_WASM_SC=ON \
                -DCMAKE_NO_USE_SWAP=ON \
                -DADDON_TX_STATUS_REQUEST=ON \
                -DONLY_LOGGING=OFF
              cmake --build build-node --target Qubic --parallel
            '

      - name: Smoke standalone Linux node in Alpine
        if: startsWith(matrix.key, 'linux-')
        shell: bash
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /smoke \
            --volume "$GITHUB_WORKSPACE/core/build-node/src/Qubic:/Qubic:ro" \
            --workdir /smoke \
            alpine:3.22 \
            sh -euxc '
              # A tick past the initial one is the only proof that matters: it means the node reached its
              # main loop, serves RPC, and is producing ticks. An exit status cannot say that — the node
              # raises SIGTERM on its own way out, so "killed by a signal" is what failure looks like too.
              # The flags match how qinit launches a node; a bare /Qubic never creates a tick.
              /Qubic --peers 127.0.0.1 --node-mode 3 --ticking-delay 1000 >node-smoke.log 2>&1 &
              node_pid=$!
              ticked=0
              for _ in $(seq 1 40); do
                json=$(wget -qO- http://127.0.0.1:41841/live/v1/tick-info 2>/dev/null) || true
                tick=$(printf "%s" "$json" | sed -n "s/.*\"tick\":\([0-9]*\).*/\1/p")
                initial=$(printf "%s" "$json" | sed -n "s/.*\"initialTick\":\([0-9]*\).*/\1/p")
                if [ -n "$tick" ] && [ -n "$initial" ] && [ "$tick" -gt "$initial" ]; then
                  ticked=1
                  break
                fi
                sleep 2
              done
              # Assert the mainnet nesting, not just that a tick advanced.
              shape_ok=0
              if [ "$ticked" -eq 1 ]; then
                ti=$(wget -qO- http://127.0.0.1:41841/live/v1/tick-info 2>/dev/null) || true
                bh=$(wget -qO- http://127.0.0.1:41841/live/v1/block-height 2>/dev/null) || true
                nested=$(printf "%s" "$ti" | sed -n "s/.*\"tickInfo\":{\([^}]*\)}.*/\1/p")
                shape_ok=1
                for field in tick duration epoch initialTick; do
                  printf "%s" "$nested" | grep -q "\"$field\":" || { echo "tick-info: tickInfo.$field missing"; shape_ok=0; }
                done
                printf "%s" "$bh" | grep -q "\"blockHeight\":{" || { echo "block-height: blockHeight wrapper missing"; shape_ok=0; }
              fi
              kill "$node_pid" 2>/dev/null || true
              if [ "$ticked" -ne 1 ] || [ "$shape_ok" -ne 1 ]; then
                cat node-smoke.log
                exit 1
              fi
            '

      # openssl/c-ares/brotli are omitted on purpose: the testnet node speaks no TLS and resolves no
      # hostname, and their prebuilt bottles are compiled for the runner OS, which would raise the
      # binary's real floor above the deployment target. libffi is built from source below instead.
      - name: Install macOS dependencies
        if: startsWith(matrix.key, 'darwin-')
        run: brew install cmake nasm jq jsoncpp fmt boost lz4 zstd lzo zlib

      - name: Resolve macOS deployment target
        if: startsWith(matrix.key, 'darwin-')
        shell: bash
        run: |
          # arm64 macOS starts at Big Sur; x86_64 is floored by std::filesystem and aligned_alloc.
          if [ "$MATRIX_KEY" = 'darwin-arm64' ]; then
            echo "MACOS_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          else
            echo "MACOS_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          fi
          echo "LIBFFI_VERSION=3.4.8" >> "$GITHUB_ENV"
          echo "LIBFFI_PREFIX=$RUNNER_TEMP/libffi-prefix" >> "$GITHUB_ENV"
        env:
          MATRIX_KEY: ${{ matrix.key }}

      - name: Cache macOS libffi
        if: startsWith(matrix.key, 'darwin-')
        id: libffi-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ runner.temp }}/libffi-prefix
          key: libffi-${{ env.LIBFFI_VERSION }}-${{ matrix.arch }}-macos${{ env.MACOS_DEPLOYMENT_TARGET }}

      - name: Build macOS libffi at the deployment target
        if: startsWith(matrix.key, 'darwin-') && steps.libffi-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o libffi.tar.gz \
            "https://github.com/libffi/libffi/releases/download/v$LIBFFI_VERSION/libffi-$LIBFFI_VERSION.tar.gz"
          tar xzf libffi.tar.gz
          cd "libffi-$LIBFFI_VERSION"
          export MACOSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET"
          # The toolchain clang cannot locate the SDK on its own the way /usr/bin/clang can, and
          # autotools links its probe binaries without the -isysroot cmake would have supplied.
          SDKROOT="$(xcrun --show-sdk-path)"
          export SDKROOT
          if ! ./configure \
            --prefix="$LIBFFI_PREFIX" \
            --enable-static \
            --disable-shared \
            --disable-docs \
            CC="$(xcrun -f clang)" \
            CFLAGS="-mmacosx-version-min=$MACOS_DEPLOYMENT_TARGET"
          then
            echo "=== config.log tail ==="
            find . -name config.log -exec tail -60 {} +
            exit 1
          fi
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install

      - name: Cache Windows dependencies
        if: matrix.key == 'windows-x64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-windows-static-rel-${{ github.run_id }}
          restore-keys: vcpkg-x64-windows-static-rel-

      - name: Configure Windows dependencies
        if: matrix.key == 'windows-x64'
        shell: pwsh
        working-directory: core
        run: |
          New-Item -ItemType Directory -Force triplets-overlay | Out-Null
          @(
            'set(VCPKG_TARGET_ARCHITECTURE x64)',
            'set(VCPKG_CRT_LINKAGE static)',
            'set(VCPKG_LIBRARY_LINKAGE static)',
            'set(VCPKG_BUILD_TYPE release)'
          ) | Set-Content -Encoding ascii triplets-overlay/x64-windows-static-rel.cmake

      - name: Build macOS node
        if: startsWith(matrix.key, 'darwin-')
        shell: bash
        working-directory: core
        run: |
          set -o pipefail
          BUILD_JOBS=$(getconf _NPROCESSORS_ONLN)
          CC=$(xcrun -f clang)
          CXX=$(xcrun -f clang++)
          {
            cmake -S . -B build-node \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
              -DCMAKE_PREFIX_PATH="$LIBFFI_PREFIX" \
              -DLibFFI_INCLUDE_DIR="$LIBFFI_PREFIX/include" \
              -DLibFFI_LIBRARY="$LIBFFI_PREFIX/lib/libffi.a" \
              -DBUILD_BROTLI=OFF \
              -DBUILD_C-ARES=OFF \
              -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
              -DBUILD_BINARY=ON \
              -DBUILD_TESTS=OFF \
              -DENABLE_AVX512=OFF \
              -DUSE_SANITIZER=OFF \
              -DTESTNET=ON \
              -DTESTNET_LITE_RAM=ON \
              -DTESTNET_PREFILL_QUS=ON \
              -DLITE_WASM_SC=ON \
              -DCMAKE_NO_USE_SWAP=ON \
              -DADDON_TX_STATUS_REQUEST=ON \
              -DONLY_LOGGING=OFF

            # drogon formats doubles with std::format, whose floating-point to_chars is macOS 13.3+,
            # so a modern libc++ defines __cpp_lib_format and pins the whole binary to 13.3. Take
            # drogon's own C++17 fallback (setprecision(17), equivalent) and keep the floor. The
            # count check turns a future drogon bump into a named error instead of a silent no-op.
            binder=build-node/_deps/drogon-src/orm_lib/src/SqlBinder.cc
            guard='#if defined(__cpp_lib_format)'
            guards=$(grep -c "$guard" "$binder")
            if [ "$guards" -ne 2 ]; then
              echo "::error::expected 2 __cpp_lib_format guards in SqlBinder.cc, found $guards"
              exit 1
            fi
            sed -i '' "s|$guard|#if 0|" "$binder"

            # With no OpenSSL, trantor compiles its own SHA1, whose little-endian architecture list
            # omits __x86_64__ and stops the build on an intentional #error. x86_64 is little-endian.
            sha1=build-node/_deps/drogon-src/trantor/trantor/utils/crypto/sha1.cc
            i386s=$(grep -c 'defined(__i386__)' "$sha1")
            if [ "$i386s" -ne 1 ]; then
              echo "::error::expected 1 __i386__ endian guard in sha1.cc, found $i386s"
              exit 1
            fi
            sed -i '' 's|defined(__i386__)|defined(__i386__) \|\| defined(__x86_64__)|' "$sha1"

            cmake --build build-node -- -j"$BUILD_JOBS" Qubic
          } 2>&1 | tee "$RUNNER_TEMP/node-build.log"

          # A prebuilt archive compiled for a newer OS links fine but silently raises the real floor
          # above the one the binary declares, so treat it as an error rather than a warning.
          if grep -q "was built for newer" "$RUNNER_TEMP/node-build.log"; then
            # head closing the pipe would SIGPIPE grep, and pipefail would abort before the message.
            grep "was built for newer" "$RUNNER_TEMP/node-build.log" | head -20 || true
            echo "::error::objects built for a newer macOS than the $MACOS_DEPLOYMENT_TARGET deployment target"
            exit 1
          fi

      - name: Upload macOS build log on failure
        if: failure() && startsWith(matrix.key, 'darwin-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: macos-build-log-${{ matrix.key }}
          path: ${{ runner.temp }}/node-build.log
          if-no-files-found: ignore

      - name: Configure Windows node
        if: matrix.key == 'windows-x64'
        shell: pwsh
        working-directory: core
        run: |
          cmake -S . -B build-win-static -A x64 -T v143 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets-overlay" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-rel `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            '-DCMAKE_SYSTEM_VERSION=10.0' `
            -DBUILD_BINARY=ON `
            -DBUILD_TESTS=OFF `
            -DENABLE_AVX512=OFF `
            -DUSE_SANITIZER=OFF `
            -DTESTNET=ON `
            -DTESTNET_LITE_RAM=ON `
            -DTESTNET_PREFILL_QUS=ON `
            -DLITE_WASM_SC=ON `
            -DCMAKE_NO_USE_SWAP=ON `
            -DADDON_TX_STATUS_REQUEST=ON `
            -DONLY_LOGGING=OFF

      - name: Build Windows node
        if: matrix.key == 'windows-x64'
        working-directory: core
        shell: pwsh
        run: |
          cmake --build build-win-static `
            --config Release `
            --target Qubic `
            --parallel 4

      - name: Stage standalone Windows node
        if: matrix.key == 'windows-x64'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'qinit-standalone'
          New-Item -ItemType Directory $stage | Out-Null
          $node = Join-Path $stage 'Qubic.exe'
          Copy-Item core/build-win-static/src/Release/Qubic.exe $node
          $staged = @(Get-ChildItem $stage)
          if ($staged.Count -ne 1 -or $staged[0].Name -ne 'Qubic.exe') {
            throw "standalone stage must contain only Qubic.exe: $($staged.Name -join ', ')"
          }
          "NODE_BIN=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Gate Windows DLL imports and PE baseline
        if: matrix.key == 'windows-x64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            throw 'dumpbin.exe was not found in the Visual Studio installation'
          }

          $dependencies = & $dumpbin /DEPENDENTS $env:NODE_BIN | Out-String
          $dependencies
          $imports = [regex]::Matches(
            $dependencies,
            '(?im)^\s+([A-Za-z0-9_.-]+\.dll)\s*$'
          ) | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if (-not $imports.Count) {
            throw 'no DLL imports were detected; dumpbin output could not be validated'
          }
          $forbidden = '^(VCRUNTIME.*|MSVCP.*|ucrtbase|libffi.*|libssl.*|libcrypto.*|cares.*|zlib.*|brotli.*|blosc.*|drogon.*|trantor.*|fmt.*|jsoncpp.*)\.dll$'
          $blocked = @($imports | Where-Object { $_ -match $forbidden })
          if ($blocked.Count) {
            throw "forbidden runtime imports: $($blocked -join ', ')"
          }
          $nonSystem = @(
            $imports | Where-Object {
              $_ -notmatch '^(api|ext)-ms-win-' -and
              -not (Test-Path (Join-Path "$env:WINDIR/System32" $_))
            }
          )
          if ($nonSystem.Count) {
            throw "non-system DLL imports: $($nonSystem -join ', ')"
          }

          $headers = & $dumpbin /HEADERS $env:NODE_BIN | Out-String
          $subsystem = [regex]::Match(
            $headers,
            '(?im)^\s*(\d+)\.(\d+)\s+subsystem version\s*$'
          )
          if (-not $subsystem.Success) {
            throw 'PE subsystem version was not found'
          }
          $subsystem.Value
          if (
            [int]$subsystem.Groups[1].Value -ne 10 -or
            [int]$subsystem.Groups[2].Value -ne 0
          ) {
            throw "expected Windows 10 PE subsystem baseline, got $($subsystem.Value.Trim())"
          }

      - name: Prepare standalone Windows release node
        if: matrix.key == 'windows-x64'
        shell: pwsh
        run: |
          Copy-Item $env:NODE_BIN $env:RELEASE_FILE
          (Get-FileHash -Algorithm SHA256 $env:RELEASE_FILE).Hash.ToLower() |
            Set-Content -NoNewline -Encoding ascii "$env:RELEASE_FILE.sha256"
        env:
          RELEASE_FILE: ${{ matrix.release_file }}

      - name: Select built POSIX node
        if: matrix.key != 'windows-x64'
        shell: bash
        run: |
          NODE_BIN="$GITHUB_WORKSPACE/core/build-node/src/Qubic"
          echo "NODE_BIN=$NODE_BIN" >> "$GITHUB_ENV"
          file "$NODE_BIN"

      - name: Gate standalone Linux binary
        if: startsWith(matrix.key, 'linux-')
        shell: bash
        run: |
          file "$NODE_BIN" | grep -q 'statically linked'
          if readelf -l "$NODE_BIN" | grep 'INTERP' >/dev/null; then
            echo "::error::standalone Linux node has a program interpreter"
            exit 1
          fi
          if readelf -d "$NODE_BIN" | grep '(NEEDED)' >/dev/null; then
            echo "::error::standalone Linux node has dynamic dependencies"
            exit 1
          fi
          if readelf -d "$NODE_BIN" | grep -E '(RPATH|RUNPATH)' >/dev/null; then
            echo "::error::standalone Linux node has a runtime library path"
            exit 1
          fi

      - name: Gate standalone macOS binary
        if: startsWith(matrix.key, 'darwin-')
        shell: bash
        run: |
          test "$(lipo -archs "$NODE_BIN")" = "$MATRIX_ARCH"
          if [ "$(stat -f%z "$NODE_BIN")" -gt 104857600 ]; then
            echo "::error::macOS node is over 100 MB: zero-filled statics are being written into the file"
            exit 1
          fi
          MIN_OS=$(otool -l "$NODE_BIN" | awk '
            $1 == "cmd" && ($2 == "LC_BUILD_VERSION" || $2 == "LC_VERSION_MIN_MACOSX") { found = 1 }
            found && ($1 == "minos" || $1 == "version") { print $2; exit }
          ')
          if [ "$MIN_OS" != "$MACOS_DEPLOYMENT_TARGET" ]; then
            echo "::error::expected macOS deployment target $MACOS_DEPLOYMENT_TARGET, got $MIN_OS"
            exit 1
          fi
          if otool -l "$NODE_BIN" | grep LC_RPATH >/dev/null; then
            echo "::error::standalone macOS node has LC_RPATH"
            exit 1
          fi
          otool -L "$NODE_BIN"
          otool -L "$NODE_BIN" | tail -n +2 | awk '{print $1}' | while read -r dependency; do
            case "$dependency" in
              /usr/lib/*|/System/Library/Frameworks/*) ;;
              *)
                echo "::error::non-system macOS dependency: $dependency"
                exit 1
                ;;
            esac
          done
        env:
          MATRIX_ARCH: ${{ matrix.arch }}

      - name: Install qinit dependencies
        shell: bash
        run: cd qinit && bun install

      - name: Build compiled qinit CLI
        shell: bash
        run: |
          cd qinit
          echo "qinit commit $(git rev-parse HEAD)"
          bun run build:bin
          if [ "$MATRIX_KEY" = 'windows-x64' ]; then
            echo "QINIT_BIN=$GITHUB_WORKSPACE/qinit/dist/qinit.exe" >> "$GITHUB_ENV"
          else
            chmod +x dist/qinit
            echo "QINIT_BIN=$GITHUB_WORKSPACE/qinit/dist/qinit" >> "$GITHUB_ENV"
          fi
        env:
          MATRIX_KEY: ${{ matrix.key }}

      - name: Qinit compatibility smoke
        shell: bash
        run: |
          cd qinit
          bun run ci:core-lite-smoke -- \
            --core-dir "$GITHUB_WORKSPACE/core" \
            --node-bin "$NODE_BIN" \
            --platform "$MATRIX_KEY" \
            --result "$GITHUB_WORKSPACE/compat-$MATRIX_KEY.json" \
            --qinit-bin "$QINIT_BIN" \
            --qinit-repository "${INPUTS_QINIT_REPOSITORY}" \
            --core-repository "$GITHUB_REPOSITORY"
        env:
          INPUTS_QINIT_REPOSITORY: ${{ inputs.qinit_repository }}
          MATRIX_KEY: ${{ matrix.key }}

      - name: Stop node
        if: always() && matrix.key != 'windows-x64'
        shell: bash
        run: |
          if [ -n "${QINIT_BIN:-}" ] && [ -f "$QINIT_BIN" ]; then
            "$QINIT_BIN" node stop
          fi

      - name: Stop Windows node
        if: always() && matrix.key == 'windows-x64'
        shell: pwsh
        run: |
          if (-not $env:QINIT_BIN -or -not (Test-Path $env:QINIT_BIN)) {
            exit 0
          }
          & $env:QINIT_BIN node stop
          if ($LASTEXITCODE -ne 0) {
            Get-Process -Name Qubic -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 500
          }
          if (Get-Process -Name Qubic -ErrorAction SilentlyContinue) {
            throw 'Qubic.exe is still running'
          }
          exit 0

      - name: Upload compatibility result
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: compat-${{ matrix.key }}
          path: compat-${{ matrix.key }}.json
          if-no-files-found: error

      - name: Package POSIX release node
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/qinit-v')) && matrix.key != 'windows-x64'
        shell: bash
        run: |
          cp "$NODE_BIN" "$RELEASE_FILE"
          shasum -a 256 "$RELEASE_FILE" | awk '{print $1}' > "$RELEASE_FILE.sha256"
        env:
          RELEASE_FILE: ${{ matrix.release_file }}

      - name: Upload release node
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/qinit-v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-node-${{ matrix.key }}
          path: |
            ${{ matrix.release_file }}
            ${{ matrix.release_file }}.sha256
          if-no-files-found: error

      - name: Diagnose contract build on failure
        if: failure()
        shell: bash
        run: |
          if [ -n "${QINIT_BIN:-}" ] && [ -f "$QINIT_BIN" ]; then
            "$QINIT_BIN" build "$GITHUB_WORKSPACE/qinit/fixtures/DigestProbe.h" \
              --contract-name DigestProbe \
              --core-dir "$GITHUB_WORKSPACE/core" \
              --out "$RUNNER_TEMP/qinit-build-diag" \
              --compiler clang \
              --skip-verify \
              --json || true
          fi

      - name: Node log tail on failure
        if: failure()
        shell: bash
        run: tail -400 "$HOME/.cache/qinit/run/node.log" 2>/dev/null || true

      - name: Upload full node log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: nodelog-${{ matrix.key }}
          path: ~/.cache/qinit/run/node.log
          if-no-files-found: ignore

  digest-check:
    name: digest-check
    needs: build-smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: 'compat-*'
          path: results
          merge-multiple: true
      - name: State digests must match across platforms
        run: |
          cd results
          echo "=== per-platform compatibility results ==="
          for result_file in compat-*.json; do
            jq -c '{platform, skipped, sources, stateDigest, qpiDigests, reason}' "$result_file"
          done

          # Every platform has to run. A floor of three let both Linux results excuse themselves for
          # months while macOS and Windows carried the gate, and Linux is what the release ships.
          RUNNABLE_COUNT=$(jq -s '[.[] | select(.skipped == false)] | length' compat-*.json)
          if [ "$RUNNABLE_COUNT" -ne 5 ]; then
            echo "need all 5 platform results runnable, got $RUNNABLE_COUNT"
            exit 1
          fi

          UNIQUE_DIGEST_COUNT=$(
            jq -r 'select(.skipped == false) |
              [.stateDigest, .qpiDigests.driver, .qpiDigests.callee] | @tsv' \
              compat-*.json | sort -u | wc -l
          )
          if [ "$UNIQUE_DIGEST_COUNT" -ne 1 ]; then
            echo "::error::DIVERGENCE — contract state digests differ across platforms"
            exit 1
          fi
          FIRST_DIGEST=$(
            jq -r 'select(.skipped == false) |
              [.stateDigest, .qpiDigests.driver, .qpiDigests.callee] | @tsv' \
              compat-*.json | sort -u
          )
          echo "OK: all $RUNNABLE_COUNT runnable platforms agree -> $FIRST_DIGEST"
