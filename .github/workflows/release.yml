name: Release
on:
  push:
    # qinit-release.yml handles dynamic-contract release tags.
    tags:
      - "*"
      - "!qinit-v*"
      - "!qinit-latest"

env:
  RELEASE_BUILD_DIR: "build"
  BUILD_CONFIGURATION: "Release"

# Read by default; the publish-* jobs raise this to contents: write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      configuration: "Release"
      build_dir: "build"

  build-linux-avx512:
    uses: ./.github/workflows/linux-build-avx512.yml
    with:
      configuration: "Release"
      build_dir: "build"

  build-windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      configuration: "Release"

  publish-linux:
    name: publish-linux
    permissions:
      contents: write  # creates the release and uploads its assets
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: QubicLiteLinuxBuild-${{ env.BUILD_CONFIGURATION }}
          path: ${{ env.RELEASE_BUILD_DIR }}

      - name: Create release package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: "Mainnet Executable Release ${{ github.ref_name }}"
          body: "Mainnet release of Qubic Core Lite executables."
          files: ${{ env.RELEASE_BUILD_DIR }}/src/Qubic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-linux-avx512:
    name: publish-linux-avx512
    permissions:
      contents: write  # creates the release and uploads its assets
    needs: build-linux-avx512
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux AVX-512 build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: QubicLiteLinuxBuild-AVX512-${{ env.BUILD_CONFIGURATION }}
          path: ${{ env.RELEASE_BUILD_DIR }}

      - name: Rename binary to QubicAVX512
        run: mv "${RELEASE_BUILD_DIR}/src/Qubic" "${RELEASE_BUILD_DIR}/src/QubicAVX512"

      - name: Create release package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: "Mainnet Executable Release ${{ github.ref_name }}"
          body: "Mainnet release of Qubic Core Lite executables."
          files: ${{ env.RELEASE_BUILD_DIR }}/src/QubicAVX512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-windows:
    name: publish-windows
    permissions:
      contents: write  # creates the release and uploads its assets
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: QubicLiteWindowsBuild-${{ env.BUILD_CONFIGURATION }}
          path: ${{ env.RELEASE_BUILD_DIR }}

      - name: Create Windows release package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: ${{ env.RELEASE_BUILD_DIR }}/**/x64/Release/Qubic.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: publish-docker
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Download Linux build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: QubicLiteLinuxBuild-${{ env.BUILD_CONFIGURATION }}
          path: build

      - name: Build Docker image
        run: docker build -t "qubiccore/lite:${GITHUB_REF_NAME}" -f docker/orchestrator/Dockerfile .

      - name: Log in to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Push Docker image
        run: docker push "qubiccore/lite:${GITHUB_REF_NAME}"
